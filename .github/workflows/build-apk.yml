name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - claude/youtube-shorts-blocker-android-cnra8h
    paths-ignore:
      - "README.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortsBlocker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-debug
          name: Shorts Blocker (debug build)
          prerelease: true
          body: |
            Gotowy do instalacji plik APK aplikacji Shorts Blocker.

            Pobierz `app-debug.apk` na telefon, otwórz, zezwol na instalacje
            z nieznanych zrodel, a nastepnie wlacz usluge w ustawieniach
            ulatwien dostepu (przycisk w aplikacji).
          files: app/build/outputs/apk/debug/app-debug.apk
